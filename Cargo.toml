[package]
name = "uti260b"
version = "0.1.0"
edition = "2024"
authors = ["leftger"]
description = "Driver, capture library, and CLI for the UNI-T UTi260B thermal imaging camera"
license = "MIT OR Apache-2.0"
keywords = ["thermal", "camera", "uti260b", "uvc", "infrared"]
categories = ["hardware-support", "multimedia::video"]

[dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native", "decoding"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
thiserror = "2.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "uti260b-cli"
path = "src/bin/cli.rs"
