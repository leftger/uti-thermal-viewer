[package]
name = "uti260b"
version = "0.1.0"
edition = "2024"
authors = ["leftger"]
description = "Thermal camera viewer, driver, and analysis tool for UNI-T UTi260B"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/uti260b"
keywords = ["thermal", "camera", "uti260b", "uvc", "egui"]
categories = ["hardware-support", "multimedia::video", "gui"]

[dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native", "decoding"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
thiserror = "2.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.32", features = ["wgpu"] }
egui_plot = "0.33"
rfd = "0.15"

[[bin]]
name = "uti260b"
path = "src/main.rs"

[[bin]]
name = "uti260b-cli"
path = "src/bin/cli.rs"
